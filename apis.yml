aid: mindtickle
name: Mindtickle
description: Mindtickle is an AI-powered revenue productivity platform that unifies
  sales enablement, training, coaching, conversation intelligence, and digital sales
  rooms into a single solution. It provides REST and GraphQL APIs for managing readiness
  programs, user provisioning, content, call intelligence, and analytics for revenue
  teams.
