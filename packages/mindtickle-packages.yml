  repository: https://gitlab.com/mindtickle/scoped-package-dashboard-plugin
  note: >-
    Published by the npm user "mindtickle" under the org-owned @mindtickle scope,
    so first-party. It is a dashboard plugin, NOT an API client - it has no
    README ("ERROR: No README data found!"), no description, and its source repo
    is a private GitLab URL. The `latest` dist-tag still points at
    1.0.0-beta.1 from 2021-11-11 while the newest build is 1.0.0-beta.6 from
    2023-12-18; nothing has shipped in over two and a half years. Because it is
    not an API client library, no SDKs pointer is emitted for it in apis.yml.

