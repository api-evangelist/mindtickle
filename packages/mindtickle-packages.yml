name: Mindtickle client libraries and packages
description: >-
  Mindtickle publishes NO first-party API client library in any public package
  registry. The only package published under the org-owned @mindtickle npm scope
  is a dashboard plugin, not an API SDK, and it has never left beta. The
  github.com/MindTickle organisation holds 39 public repositories and every one
  of them is a fork of an unrelated upstream project (Kafka, jsonparser, RxSwift,
  kiam, apollo-kotlin, ...) - there is no first-party SDK, CLI or spec repo.
  Third-party packages that wrap Mindtickle exist and are listed below with
  official: false.

