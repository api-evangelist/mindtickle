generated: '2026-08-14'
method: probed
source: live GET of /.well-known/* on every Mindtickle host named in apis.yml
name: Mindtickle well-known discovery surface
description: >-
  Probe of the RFC 8615 /.well-known/ surface across every Mindtickle host. The
  marketing host www.mindtickle.com is a Next.js site that answers HTTP 200 with
  its own 404 HTML page for every unknown path, so every 200 recorded there is a
  soft-404 and is scored as a MISS, not a document. The only real documents are
  served by the application host app.mindtickle.com, which publishes an RFC 8414
  OAuth 2.0 authorization-server metadata document and an RFC 9728 OAuth
  protected-resource metadata document anonymously.

hosts:
- host: https://app.mindtickle.com
  documents:
  - path: /.well-known/oauth-authorization-server
    spec: RFC 8414
    status: 200
    content_type: application/json
    real_document: true
    file: mindtickle-oauth-authorization-server.json
  - path: /.well-known/oauth-protected-resource
    spec: RFC 9728
    status: 200
    content_type: application/json
    real_document: true
    file: mindtickle-oauth-protected-resource.json
  - path: /.well-known/jwks.json
    spec: RFC 7517
    status: 200
    real_document: true
    file: null
    note: >-
      JWKS is served and reachable anonymously; not archived here because key
      material rotates and a stale copy is worse than none.
  - path: /.well-known/security.txt
    status: 404
    real_document: false
  - path: /.well-known/openid-configuration
    status: 404
    real_document: false
  - path: /.well-known/api-catalog
